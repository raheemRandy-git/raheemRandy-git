name: Generate Pacman Style Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Generate Pacman Style Snake
        uses: Platane/snk@v3
        with:
          github_user_name: raheemRandy-git
          outputs: |
            dist/pacman.svg?palette=github-dark&color_snake=#FFD700&color_dots=#FFFF00,#FFD700,#FFA500,#FF4500

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
