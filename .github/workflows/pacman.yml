name: Generate Pacman Contribution

on:
  schedule:
    - cron: "0 */12 * * *"   # runs every 12 hours
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Pacman Snake
        uses: Platane/snk@v3
        with:
          github_user_name: raheemRandy-git
          outputs: |
            dist/pacman.svg?palette=github-dark&color_snake=#FFD700&color_dots=#0e4429,#006d32,#26a641,#39d353

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
