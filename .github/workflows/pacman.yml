name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Pacman Snake
        uses: Platane/snk@v3
        with:
          github_user_name: raheemRandy-git
          outputs: |
            dist/pacman.svg?palette=github-dark&color_snake=#FFD700&color_dots=#FFFF00,#FFD700,#FFA500,#FF4500

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
